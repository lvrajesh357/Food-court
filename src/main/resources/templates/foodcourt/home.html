<style>
  /* Mobile-friendly tweaks on top of Bootstrap */
  body { padding-left: 0; padding-right: 0; }
  table { max-width: 100%; }
  .table-responsive-wrap { overflow-x: auto; }
  img { max-width: 100%; height: auto; }
  @media (max-width: 576px) {
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.25rem; }
    .payment-option { width: 100% !important; }
    .form-group input, .form-group select { width: 100% !important; box-sizing: border-box; }
  
  
</style>

    <title>Home</title>
    <link th:href="@{/css/home.css}" rel="stylesheet" />
 
<script>
let slideIndex = 0;
let slides;
let slideInterval;

window.onload = function () {
    slides = document.getElementsByClassName("slide");
    showSlide(slideIndex);
    slideInterval = setInterval(() => changeSlide(1), 10000); // 10 seconds
};

function showSlide(index) {
    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }
    slides[index].style.display = "block";
}

function changeSlide(n) {
    clearInterval(slideInterval); // Stop auto-sliding when user interacts
    slideIndex = (slideIndex + n + slides.length) % slides.length;
    showSlide(slideIndex);
    slideInterval = setInterval(() => changeSlide(1), 10000); // Restart interval
}



</script>
