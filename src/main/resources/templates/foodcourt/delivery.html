<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Status</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1f1147 0%, #3a1c71 45%, #d76d77 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #222;
  }

  .delivery-wrapper {
    max-width: 620px;
    margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }

  .delivery-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .delivery-header {
    background: linear-gradient(90deg, #ff9a44, #ff6f61);
    color: #fff;
    padding: 1.5rem 1.5rem 1.2rem;
    text-align: center;
  }
  .delivery-header .status-emoji { font-size: 2.4rem; }
  .delivery-header h2 {
    margin: 0.3rem 0 0;
    font-weight: 700;
    font-size: 1.4rem;
  }
  .delivery-header .status-sub { opacity: 0.9; font-size: 0.9rem; }

  .delivery-body { padding: 1.5rem; }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 0.55rem 0;
    border-bottom: 1px dashed #eee;
    font-size: 0.95rem;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #888; }
  .info-value { font-weight: 600; text-align: right; }

  .amount-highlight {
    background: #fff4e6;
    border-radius: 10px;
    padding: 0.9rem 1rem;
    text-align: center;
    margin: 1rem 0;
  }
  .amount-highlight .amount-value {
    font-size: 1.7rem;
    font-weight: 800;
    color: #ff6f00;
  }
  .amount-highlight .amount-label { font-size: 0.8rem; color: #999; }

  .notify-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0 1rem; }
  .notify-badge {
    background: #e6f8ee;
    color: #1e7e42;
    border-radius: 20px;
    padding: 0.3rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 600;
  }

  /* Delivery-in-progress: real scrolling road with a naturally moving van */
  .delivery-road {
    position: relative;
    width: 100%;
    height: 70px;
    margin: 1.2rem auto 0.5rem;
    border-radius: 10px;
    overflow: hidden;
    background: #4a4a4a;
    background-image: repeating-linear-gradient(
      90deg,
      #f5c518 0px, #f5c518 26px,
      transparent 26px, transparent 52px
    );
    background-position: 0 bottom;
    background-size: 100% 4px;
    background-repeat: repeat-x;
    animation: scrollRoad 1.4s linear infinite;
  }
  .delivery-road-bike {
    position: absolute;
    bottom: 8px;
    left: 12%;
    font-size: 2.1rem;
    animation: vanDrive 0.9s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .delivery-road-label {
    text-align: center;
    font-size: 0.85rem;
    color: #666;
    margin-top: 6px;
  }
  @keyframes scrollRoad {
    from { background-position-x: 0; }
    to   { background-position-x: -52px; }
  }
  @keyframes vanDrive {
    0%   { transform: translateY(0) scaleX(1); }
    45%  { transform: translateY(-2px) scaleX(1.02); }
    55%  { transform: translateY(-2px) scaleX(0.98); }
    100% { transform: translateY(0) scaleX(1); }
  }

  .delivery-message-box {
    background: #f8f9fb;
    border-radius: 10px;
    padding: 1rem;
    margin-top: 1.2rem;
    font-size: 0.85rem;
    color: #444;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .back-home-btn {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    padding: 0.7rem;
    border-radius: 10px;
    background: linear-gradient(90deg, #3a1c71, #d76d77);
    color: #fff !important;
    font-weight: 600;
    text-decoration: none;
  }
  .back-home-btn:hover { opacity: 0.92; color: #fff; }

  @media (max-width: 576px) {
    .delivery-header h2 { font-size: 1.15rem; }
    .amount-highlight .amount-value { font-size: 1.4rem; }
  }
</style>
<link rel="stylesheet" href="/css/theme-toggle.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6f61">
<link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<body>
<div class="delivery-wrapper">

  <div class="delivery-card">
    <div class="delivery-header">
      <div class="status-emoji">🚐</div>
      <h2>Preparing your order</h2>
      <div class="status-sub">Thank you, <span th:text="${username}">Customer</span>!</div>
    </div>

    <div class="delivery-body">

      <div class="amount-highlight">
        <div class="amount-value">₹<span th:text="${amount}">0.00</span></div>
        <div class="amount-label">paid via <span th:text="${paymentMode}">N/A</span></div>
      </div>

      <div class="info-row">
        <span class="info-label">Delivery Address</span>
        <span class="info-value" th:text="${address}">Some Address</span>
      </div>
      <div class="info-row">
        <span class="info-label">Order Time</span>
        <span class="info-value" th:text="${orderTime}">--</span>
      </div>

      <div class="notify-badges">
        <span class="notify-badge" th:if="${customerNumber != null and !customerNumber.isEmpty()}">📞 Contact number on file: <span th:text="${customerNumber}"></span></span>
      </div>

      <div class="delivery-road" aria-hidden="true">
        <div class="delivery-road-bike">🚐</div>
      </div>
      <div class="delivery-road-label">Your delivery van is on the road, heading your way...</div>

      <p class="text-center mt-2 mb-0" style="font-size:0.9rem; color:#555;">
        🚚 Estimated delivery in: <strong><span th:text="${etaMinutes}">15</span> minutes</strong>
      </p>

      <pre class="delivery-message-box" th:text="${deliveryMessage}">Delivery details...</pre>

      <a th:href="@{/home}" class="back-home-btn">Back to Home</a>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!--  
<script src="/js/theme-toggle.js"></script>
<script src="/js/pwa-init.js"></script>  -->
</body>
</html>
