<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* Mobile-friendly tweaks on top of Bootstrap */
  body { padding-left: 0; padding-right: 0; }
  table { max-width: 100%; }
  .table-responsive-wrap { overflow-x: auto; }
  img { max-width: 100%; height: auto; }
  @media (max-width: 576px) {
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.25rem; }
    .payment-option { width: 100% !important; }
    .form-group input, .form-group select { width: 100% !important; box-sizing: border-box; }
  }
</style>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="/css/theme-toggle.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6f61">
<link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<body>
<div class="container-fluid px-3 px-md-4">

<h2>Payment Successful!</h2>
<p th:text="'Hello ' + ${username} + ', your payment of ₹' + ${amount} + ' via ' + ${paymentMode} + ' was successful.'"></p>
<p th:text="${deliveryMessage}"></p>
<p>Email sent to: <span th:text="${email}"></span></p>
<p>WhatsApp confirmation sent to: <span th:text="${whatsapp}"></span></p>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
<script src="/js/theme-toggle.js"></script>
<script src="/js/pwa-init.js"></script>
</body>
</html>
