<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner - Pending Orders</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f5f7; padding: 1.5rem 1rem; }
  .page-wrap { max-width: 900px; margin: 0 auto; }
  .order-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .order-card.unverified { border-left: 5px solid #ff9800; }
  .order-card.verified { border-left: 5px solid #28a745; opacity: 0.85; }
  .order-meta { font-size: 0.85rem; color: #666; }
  .access-form {
    max-width: 360px;
    margin: 4rem auto;
    background: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<div class="page-wrap">

  <div th:if="${accessDenied}" class="access-form">
    <h4 class="mb-3">Owner Access</h4>
    <form th:action="@{/owner/orders}" method="get">
      <div class="mb-3">
        <label class="form-label">Access Code</label>
        <input type="password" name="code" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">View Orders</button>
    </form>
  </div>

  <div th:unless="${accessDenied}">
    <h3 class="mb-3">🔔 Orders Awaiting Payment Verification</h3>
    <p th:if="${msg}" class="alert alert-success" th:text="${msg}"></p>

    <div th:if="${#lists.isEmpty(unverifiedGroups)}" class="text-muted mb-4">
      Nothing waiting on verification right now.
    </div>

    <div class="order-card unverified" th:each="group : ${unverifiedGroups}">
      <div class="d-flex justify-content-between flex-wrap">
        <div>
          <strong th:text="${group.customerName}">Customer</strong>
          <div class="order-meta">
            Order: <span th:text="${group.orderGroupId}"></span> ·
            <span th:text="${group.orderTime}"></span>
          </div>
        </div>
        <div class="text-end">
          <div><strong>₹<span th:text="${group.total}"></span></strong></div>
          <div class="order-meta" th:text="${group.paymentMode}"></div>
        </div>
      </div>
      <div class="mt-2"><strong>Payment reference:</strong> <span th:text="${group.paymentReference}"></span></div>
      <ul class="mb-2">
        <li th:each="item : ${group.items}" th:text="${item.itemName} + ' x' + ${item.quantity} + ' (₹' + ${item.price} + ')'"></li>
      </ul>
      <form th:action="@{/owner/orders/verify}" method="post" class="d-inline">
        <input type="hidden" name="code" th:value="${code}">
        <input type="hidden" name="orderGroupId" th:value="${group.orderGroupId}">
        <button type="submit" class="btn btn-success btn-sm">✅ Mark Payment Verified</button>
      </form>
    </div>

    <h4 class="mt-5 mb-3">✅ Verified Orders</h4>
    <div th:if="${#lists.isEmpty(verifiedGroups)}" class="text-muted">No verified orders yet.</div>
    <div class="order-card verified" th:each="group : ${verifiedGroups}">
      <div class="d-flex justify-content-between flex-wrap">
        <div>
          <strong th:text="${group.customerName}">Customer</strong>
          <div class="order-meta">
            Order: <span th:text="${group.orderGroupId}"></span> ·
            <span th:text="${group.orderTime}"></span>
          </div>
        </div>
        <div class="text-end">
          <div><strong>₹<span th:text="${group.total}"></span></strong></div>
          <div class="order-meta" th:text="${group.paymentMode}"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<link rel="stylesheet" href="/css/theme-toggle.css">
<script src="/js/theme-toggle.js"></script>
</body>
</html>
