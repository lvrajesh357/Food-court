  /* Mobile-friendly tweaks on top of Bootstrap */
  body { padding-left: 0; padding-right: 0; }
  table { max-width: 100%; }

  img { max-width: 100%; height: auto; }

    h1 { font-size: 1.5rem; }

<title>Your Cart</title>

<script>
function removeFromCart(index) {
  fetch(`/cart/remove/${index}`, {
    method: 'DELETE'
  })
  .then(response => response.text())
  .then(data => alert(data));
}

function updateCartCount() {
    fetch('/cart/count')
        .then(response => response.json())
        .then(count => {
            const cartCount = document.getElementById('cart-count');

            if (cartCount) {
                cartCount.textContent = count;
            }
        })
        .catch(error => console.error(error));
}
</script>

<script>
	function confirmRemoval(event, itemName) {
		// No confirmation prompt - removal happens immediately on click.
	}
	
	
	
	
	function addToCart(name, quantity, category, price) {
	  fetch('/cart/add-to-session', {
	    method: 'POST',
	    headers: { 'Content-Type': 'application/json' },
	    body: JSON.stringify({
	      name: name,
	      quantity: quantity,
	      category: category,
	      price: price
	    })
	  })
	  .then(response => response.text())
	  .then(message => {
	    alert(message);  // e.g., "Item added"
	    // Optional: update cart count or redirect
	  })
	  .catch(error => {
	    console.error('Error adding item to cart:', error);
	  });
	}
	

	
	
	 function checkCartAndPlaceOrder() {
		    const cartRows = document.querySelectorAll("tbody tr");
		    if (cartRows.length === 0) {
		      alert("Please select items to place your order.");
		    } else {
		      window.location.href = "/orders";
		    }
		  }
</script>
