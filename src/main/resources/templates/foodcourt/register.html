<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: black;
    font-family: Arial, sans-serif;
    color: white;
  }
  .container-fluid {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .register-card {
    background: #111;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 2rem 1.75rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .register-card h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 1.25rem;
  }
  .tab-switch {
    display: flex;
    border: 1px solid #444;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .tab-switch button {
    flex: 1;
    padding: 0.55rem;
    background: #1c1c1c;
    color: #aaa;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .tab-switch button.active {
    background: linear-gradient(90deg, #ff9a44, #ff6f61);
    color: white;
  }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #ddd; }
  .form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: white;
    font-size: 1rem;
  }
  .form-group input:focus { outline: none; border-color: #ff6f61; }
  .btn-primary-custom {
    width: 100%;
    padding: 0.65rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff9a44, #ff6f61);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  .btn-primary-custom:hover { opacity: 0.92; }
  .msg-box {
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    text-align: center;
  }
  .email-display { color: #ff9a44; font-weight: 600; }
  .helper-link {
    display: block;
    text-align: center;
    margin-top: 0.9rem;
    font-size: 0.85rem;
  }
  .helper-link a { color: #ff9a44; text-decoration: none; }
  .helper-link a:hover { text-decoration: underline; }
  .method-panel { display: none; }
  .method-panel.active { display: block; }
</style>
<link rel="stylesheet" href="/css/theme-toggle.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6f61">
<link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<body>
<div class="container-fluid">
  <div class="register-card">
    <h1>Welcome to FoodCourt</h1>

    <div class="tab-switch">
      <button type="button" id="tabPwdBtn" class="active" onclick="showTab('pwd')">Username &amp; Password</button>
      <button type="button" id="tabOtpBtn" onclick="showTab('otp')">Email OTP</button>
    </div>

    <div class="msg-box" th:if="${msg != null}" th:text="${msg}"></div>

    <!-- METHOD 1: username + password -->
    <div id="pwdPanel" class="method-panel active">
      <form th:action="@{/register}" method="post" name="register" onsubmit="return validatePwd()">
        <div class="form-group">
          <label for="name">Enter username:</label>
          <input type="text" id="name" name="name" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label for="pwd">Enter password:</label>
          <input type="password" id="pwd" name="pwd" placeholder="Choose a password">
        </div>
        <div class="form-group">
          <label for="pass">Confirm password:</label>
          <input type="password" id="pass" name="pass" placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn-primary-custom">Register</button>
      </form>
    </div>

    <!-- METHOD 2: email + OTP -->
    <div id="otpPanel" class="method-panel">
      <!-- STEP 1: name + email -->
      <form th:if="${otpSent == null}" th:action="@{/register/send-otp}" method="post" onsubmit="return validateEmail()">
        <div class="form-group">
          <label for="otpName">Your Name</label>
          <input type="text" id="otpName" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn-primary-custom">Send OTP</button>
      </form>

      <!-- STEP 2: enter OTP -->
      <form th:if="${otpSent != null}" th:action="@{/register/verify-otp}" method="post">
        <p style="text-align:center; font-size:0.85rem; color:#ccc;">
          OTP sent to <span class="email-display" th:text="${email}">you@example.com</span>
        </p>
        <div class="form-group">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" required autofocus>
        </div>
        <button type="submit" class="btn-primary-custom">Verify &amp; Register</button>
      </form>

      <div class="helper-link" th:if="${otpSent != null}">
        <form th:action="@{/resend-otp}" method="post" style="display:inline;">
          <button type="submit" style="background:none;border:none;color:#ff9a44;cursor:pointer;padding:0;font-size:0.85rem;">Resend OTP</button>
        </form>
        &nbsp;|&nbsp;
        <a th:href="@{/register}">Start over</a>
      </div>
    </div>

    <div class="helper-link">
      Already have an account? <a th:href="@{/login}">Login</a>
    </div>
  </div>
</div>

<script th:inline="javascript">
  function showTab(which) {
    document.getElementById('pwdPanel').classList.toggle('active', which === 'pwd');
    document.getElementById('otpPanel').classList.toggle('active', which === 'otp');
    document.getElementById('tabPwdBtn').classList.toggle('active', which === 'pwd');
    document.getElementById('tabOtpBtn').classList.toggle('active', which === 'otp');
  }

  function validatePwd() {
    var name = document.forms["register"]["name"].value;
    var pwd = document.forms["register"]["pwd"].value;
    var confpwd = document.forms["register"]["pass"].value;

    if (name === "") { alert("User name cannot be empty"); return false; }
    if (pwd === "") { alert("Password cannot be empty"); return false; }
    if (confpwd === "") { alert("Confirm Password cannot be empty"); return false; }
    if (pwd !== confpwd) { alert("Passwords do not match"); return false; }
    return true;
  }

  function validateEmail() {
    var email = document.getElementById("email").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      alert("Please enter a valid email address.");
      return false;
    }
    return true;
  }

  // If the server just sent an OTP (otpSent model attribute present), default to the OTP tab.
  var otpSentFlag = /*[[${otpSent}]]*/ null;
  if (otpSentFlag) { showTab('otp'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/theme-toggle.js"></script>
<script src="/js/pwa-init.js"></script>
</body>
</html>
