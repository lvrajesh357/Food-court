spring.application.name=thymeleaf-currypoint

server.port=${PORT:8989}

#thymeleaf
spring.thymeleaf.prefix=classpath:/templates/foodcourt/
spring.thymeleaf.suffix=.html

#database connection - values come from environment variables in production.
#Local defaults below let it still run out-of-the-box on a local MySQL instance.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodcourt}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

#hibernate connection
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Gmail SMTP configuration - set MAIL_USERNAME / MAIL_PASSWORD as env vars.
# MAIL_PASSWORD must be a Gmail "app password", not your normal Gmail password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:varmastyle9959@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dtpq ahdy ffwt oybo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

