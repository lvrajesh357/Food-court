
spring.application.name=thymeleaf-currypoint

server.port=${PORT:10000}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/foodcourt/
spring.thymeleaf.suffix=.html

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP timeouts: if the mail server/port is unreachable (e.g. Render's free plan blocks SMTP),
# fail within a few seconds instead of hanging a thread for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---- Sending mail over HTTPS (REQUIRED on Render's free plan, which blocks SMTP) ----
# Create a free Brevo account, verify your sender email, create an API key and set these
# environment variables on the server. When BREVO_API_KEY is empty, SMTP (Gmail) is used instead.
# Brevo HTTPS email configuration
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:FoodCourt}

# Application owner configuration
app.owner-email=${OWNER_EMAIL:}
app.owner-upi=${OWNER_UPI_ID:}
app.owner-access-code=${OWNER_ACCESS_CODE:}


