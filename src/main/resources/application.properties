
spring.application.name=thymeleaf-currypoint

server.port=${PORT:8989}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/foodcourt/
spring.thymeleaf.suffix=.html

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application owner configuration
app.owner-email=${OWNER_EMAIL}
app.owner-upi=${OWNER_UPI_ID}
app.owner-access-code=${OWNER_ACCESS_CODE}



